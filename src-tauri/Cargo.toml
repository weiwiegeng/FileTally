[package]
name = "filetally"
version = "0.1.0"
description = "FileTally - Smart File Management System"
authors = ["you"]
edition = "2021"

[lib]
name = "filetally_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# Tauri framework
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# System information
sysinfo = "0.32"

# File system operations
walkdir = "2.5"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1.0"
thiserror = "2.0"

# Utilities
chrono = "0.4"
dirs = "5.0"

# Document parsing
pdf-extract = "0.7"
regex = "1.10"
encoding_rs = "0.8"

# Parallel processing
rayon = "1.10"

# Excel processing
calamine = "0.26"
rust_xlsxwriter = "0.79"

