  <circle cx="708" cy="684" r="112" fill="url(#badge)"/>
  <circle cx="708" cy="684" r="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.35" stroke-width="12"/>
  <path d="M648 686l40 40 84-90" stroke="#FFFFFF" stroke-width="40" stroke-linecap="round" stroke-linejoin="round"/>
