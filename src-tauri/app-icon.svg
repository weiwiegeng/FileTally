  <!-- Checklist rows (tally) -->
  <g stroke-linecap="round" stroke-linejoin="round">
    <path d="M348 508l18 18 30-34" stroke="#4C8DFF" stroke-width="18"/>
    <rect x="416" y="502" width="220" height="24" rx="12" fill="#7EB0FF" fill-opacity="0.55"/>

    <path d="M348 568l18 18 30-34" stroke="#4C8DFF" stroke-width="18"/>
    <rect x="416" y="562" width="188" height="24" rx="12" fill="#7EB0FF" fill-opacity="0.42"/>

