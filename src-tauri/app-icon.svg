<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
  <defs>
    <linearGradient id="bg" x1="140" y1="60" x2="900" y2="980" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5B9BFF"/>
      <stop offset="40%" stop-color="#2F74F0"/>
      <stop offset="100%" stop-color="#1548C2"/>
    </linearGradient>
    <linearGradient id="folderBack" x1="300" y1="270" x2="720" y2="500" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F4F8FF"/>
      <stop offset="100%" stop-color="#C9DEFF"/>
    </linearGradient>
    <linearGradient id="folderFront" x1="240" y1="380" x2="780" y2="820" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#EEF4FF"/>
    </linearGradient>
    <linearGradient id="badge" x1="600" y1="600" x2="860" y2="860" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#85E85A"/>
