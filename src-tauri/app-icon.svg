  <path d="M268 128c116-24 388-24 504 0 42 10 74 38 86 78v54c-48-48-146-84-338-84s-290 36-338 84v-54c12-40 44-68 86-78Z" fill="#FFFFFF" fill-opacity="0.18"/>

