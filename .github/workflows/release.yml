# 打标签或手动触发时，在各平台原生 runner 上构建安装包并挂到 GitHub Release。
# 日常 push/PR 只跑 ci.yml（检查），避免每次提交都做完整打包。
#
# 用法：
#   git tag v1.0.0 && git push origin v1.0.0
#   或在 Actions → Release → Run workflow
#
# 产物（每平台一种主安装包，避免 targets=all 刷出一堆格式）：
#   macOS Apple Silicon → .dmg
#   Windows             → NSIS .exe
#   Linux               → .AppImage
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      draft:
        description: 'Create draft release'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  release:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-latest = Apple Silicon。Intel Mac 交叉编译在 CI 上不稳定，暂不打。
          - platform: macos-latest
            args: --bundles dmg
          - platform: windows-latest
            args: --bundles nsis
          - platform: ubuntu-22.04
            args: --bundles appimage

    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Read app version
        id: version
        shell: bash
        run: |
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and upload release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Do not put a trailing "--" here — tauri-action already inserts one before args.
          tauriScript: npm run tauri
          tagName: ${{ steps.version.outputs.tag }}
          releaseName: FileTally v${{ steps.version.outputs.version }}
          releaseBody: |
            FileTally **v${{ steps.version.outputs.version }}**

            | 系统 | 下载 |
            |------|------|
            | Windows | `FileTally_*_x64-setup.exe` |
            | macOS (Apple Silicon) | `FileTally_*_aarch64.dmg` |
            | Linux | `FileTally_*_amd64.AppImage` |

            Source code archives are auto-attached by GitHub.
          releaseDraft: ${{ github.event_name != 'workflow_dispatch' || inputs.draft }}
          prerelease: false
          args: ${{ matrix.args }}
